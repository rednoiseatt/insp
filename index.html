<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Inspiratie">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
 <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<title>Inspiratie</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
   font-family: 'Libre Baskerville', Georgia, serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  /* the die is the button */
  .die {
    display: block; padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
    width: min(52vw, 40vh, 288px);
aspect-ratio: 1;
    opacity: 1; transition: opacity 1.8s ease;
  }
  .die img { width: 100%; height: 100%; display: block; pointer-events: none; }
  body.showing .die {
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.8s ease;
}

body:not(.showing) .die {
  transition: opacity 1.8s ease 1s;
}

  /* the prompt */
.prompt {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(40px + env(safe-area-inset-top)) 34px calc(40px + env(safe-area-inset-bottom));
  text-align: center;
  color: #f1ebdc;
  font-size: clamp(26px, 7vw, 38px);
  line-height: 1.3;
  letter-spacing: .01em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
  word-break: break-word;
  transform: translateY(-2%);
}
  body.showing .prompt { opacity: 1; pointer-events: auto; transition: opacity 1.8s ease 1s; }
</style>
</head>
<body>
  <button class="die" id="die" aria-label="Get a prompt"><img src="die.png" alt=""></button>
  <div class="prompt" id="prompt"></div>


<script>
// YOUR PROMPTS: one per line, in quotes, each followed by a comma.
const prompts = [
// Maken & creëren
"pennen, potloden, papier, inkt",
"Book of Ideas",
"uitvinden",
"schilderen",
"tekenen",
"boekbinden",
"collage",
"atelier",
"experimenteren",
"DIY",

// Muziek & geluid
"modular synthesis",
"vinyl",
"field recording",
"gitaar",
"nieuwe muziek",
"tin whistle",
"mondharmonica",
"radio",
"concert",
"cassette",
"electronica",

// Schrijven & literatuur
"nieuw boek",
"schrijven",
"brief schrijven",
"poëzie",
"typemachine",
"journalen",

// Beeld, film & fotografie
"analoge fotografie",
"fotoboek",
"film",
"documentaire",
"cinema",
"viewmaster",
"typografie",
"fotograferen", 

// Media & verhalen
"onderzoeksjournalistiek",
"podcast",
"YouTube geschiedenis",
"human interest", 
"wereldwijde web",

// Spel & strategie
"gezelschapsspel",
"Oblique Strategies",
"I Tjing",
"cryptografie",
"schaken",
"spionage",
 "wiskunde",

// Natuur & buiten
"bomen",
"wolken",
"wilde natuur",
"bergen",
"vogels",
"zee",
"vakantie",

// Eten & drinken
"nieuw recept",
"nieuw bakrecept",

// Verbeelding & ideeën
"ruimte",
"tijdreizen",
"wereldbouw",
"perspectief",
"niche",

// Cultuur & plekken
"museum",
"event",
"subcultuur",
"punk",
"graffiti",
"nieuwe plek",
"oude plek",
"andere omgeving",
 "makerspace", 
 "hackerspace", 
 "broedplaats", 
 "vrijplaats",

// Persoonlijk & welzijn
"echte ontspanning",
"zelfzorg",
"routine",
"personaliseren",
"plannen",
"ontdekken",
"verbinden",
"integreren",
 "filosofie",
 "vrijwilligerswerk",

// Mensen & identiteit
"kapper",
"tattoo",
"piercing",
"nostalgie", 

// Leren & ontdekken
"workshop",
"cursus",
"sport", 
];

const die = document.getElementById('die');
const box = document.getElementById('prompt');

let bag = [], last = null, busy = false;
let hideTimer = null;

function next() {
  if (!prompts.length) return "Add your prompts to the list in the file.";
  if (!bag.length) {
    bag = prompts.slice();
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    if (bag.length > 1 && bag[bag.length - 1] === last) bag.unshift(bag.pop());
  }
  last = bag.pop();
  return last;
}

function lock() {
  busy = true;
  setTimeout(() => { busy = false; }, 2800);
}

function hidePrompt() {
  clearTimeout(hideTimer);
  document.body.classList.remove('showing');
}

die.addEventListener('click', () => {
  if (busy) return;

  lock();
  clearTimeout(hideTimer);

  box.textContent = next();
  document.body.classList.add('showing');

  // Automatically hide the prompt after 10 seconds
  hideTimer = setTimeout(() => {
    hidePrompt();
  }, 10000);
});

box.addEventListener('click', () => {
  if (busy) return;

  lock();
  hidePrompt();
});
</script>

</body>
</html>
